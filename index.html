<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

        body {
            font-family: 'Segoe UI', Arial, sans-serif;

            text-align: center;
        }
        h1 {
            font-size: 36px;
            color: #a78bfa;
        }
        .release-card {
            background: #221833;
            border: 1px solid #332548;
            border-radius: 16px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            text-align: left;
        }
        .release-card h2 {

            color: #7dd3fc;
        }
        .release-card p {
            margin: 5px 0;
            color: #9b8fc0;
        }
        .release-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
